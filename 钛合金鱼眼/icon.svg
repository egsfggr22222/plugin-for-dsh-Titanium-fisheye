<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8e2ec"/>
      <stop offset="45%" stop-color="#8e9aa8"/>
      <stop offset="100%" stop-color="#4c5763"/>
    </linearGradient>
    <radialGradient id="lens" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#9fe8ff"/>
      <stop offset="45%" stop-color="#1f7fd6"/>
      <stop offset="100%" stop-color="#0a2a4a"/>
    </radialGradient>
  </defs>

  <!-- Titanium ring -->
  <circle cx="32" cy="32" r="29" fill="url(#metal)"/>
  <circle cx="32" cy="32" r="29" fill="none" stroke="#2a323b" stroke-width="1.5"/>

  <!-- Lens -->
  <circle cx="32" cy="32" r="21" fill="url(#lens)"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="#1a2129" stroke-width="2"/>

  <!-- Fish-eye highlight -->
  <ellipse cx="25" cy="23" rx="7" ry="5" fill="#ffffff" opacity="0.55" transform="rotate(-25 25 23)"/>
  <circle cx="41" cy="42" r="3" fill="#bfe8ff" opacity="0.45"/>

  <!-- Iris hint -->
  <circle cx="32" cy="32" r="9" fill="none" stroke="#0b1b2a" stroke-width="1.2" opacity="0.55"/>
</svg>
